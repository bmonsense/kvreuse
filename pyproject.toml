[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bmonsense-kvreuse"
version = "0.1.0"
description = "按共享前缀长度计算可复用比例与理论加速比"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bmonsense" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bmonsense.github.io"
Repository = "https://github.com/bmonsense/kvreuse"
Issues = "https://github.com/bmonsense/kvreuse/issues"

[project.scripts]
kvreuse = "kvreuse:main"

[tool.setuptools]
py-modules = ["kvreuse"]
